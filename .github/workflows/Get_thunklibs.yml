name: Get FEX ThunkLibs (Generate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.arm64  # Pastikan menggunakan runner ARM64

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget zstd tar squashfs-tools fuse squashfuse

      - name: Download and install FEX-emu package (Arch Linux ARM64)
        run: |
          wget https://repo.archlinuxcn.org/aarch64/fex-emu-2605-1-aarch64.pkg.tar.zst
          mkdir -p /tmp/fex-pkg
          tar --zstd -xf fex-emu-2605-1-aarch64.pkg.tar.zst -C /tmp/fex-pkg
          sudo cp -r /tmp/fex-pkg/usr/* /usr/local/
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/fex.conf
          sudo ldconfig

      - name: Debug - List FEX binaries
        run: |
          echo "=== Binaries in /usr/local/bin ==="
          ls -la /usr/local/bin/FEX* 2>/dev/null || echo "Tidak ada"
          echo "=== Contents of /tmp/fex-pkg/usr/bin ==="
          ls -la /tmp/fex-pkg/usr/bin/ 2>/dev/null || echo "Tidak ada"
          echo "=== Contents of /usr/local/lib/fex-emu ==="
          ls -la /usr/local/lib/fex-emu/ 2>/dev/null || echo "Tidak ada"

      - name: Download RootFS (SquashFS)
        run: |
          mkdir -p $HOME/.fex-emu/RootFS/
          wget -O $HOME/.fex-emu/RootFS/Ubuntu_24_04.sqsh \
            https://rootfs.fex-emu.gg/Ubuntu_24_04/2025-12-27/Ubuntu_24_04.sqsh

      - name: Generate ThunkLibs using FEXThunkLibsGenerator
        id: generate_thunks
        run: |
          THUNK_OUTPUT_DIR="$HOME/fex-thunklibs"
          mkdir -p "$THUNK_OUTPUT_DIR"

          # Mount rootfs squashfs
          mkdir -p /tmp/rootfs-mount
          sudo mount -t squashfs -o ro "$HOME/.fex-emu/RootFS/Ubuntu_24_04.sqsh" /tmp/rootfs-mount

          # Cek apakah FEXThunkLibsGenerator ada
          if command -v FEXThunkLibsGenerator &> /dev/null; then
            echo "Menjalankan FEXThunkLibsGenerator..."
            FEXThunkLibsGenerator --rootfs /tmp/rootfs-mount --output "$THUNK_OUTPUT_DIR"
          elif [ -f "/usr/local/bin/FEXThunkLibsGenerator" ]; then
            echo "Menjalankan FEXThunkLibsGenerator dari /usr/local/bin..."
            /usr/local/bin/FEXThunkLibsGenerator --rootfs /tmp/rootfs-mount --output "$THUNK_OUTPUT_DIR"
          else
            echo "FEXThunkLibsGenerator tidak ditemukan, mencoba metode manual..."
            # Manual find
            find /tmp/rootfs-mount -type f \( -name "*thunk*.so*" -o -name "*thunk*.a" \) -exec cp -v {} "$THUNK_OUTPUT_DIR/" \;
            # Cari juga di host
            find /usr/local -type f -name "*thunk*" -exec cp -v {} "$THUNK_OUTPUT_DIR/" \;
            find /tmp/fex-pkg -type f -name "*thunk*" -exec cp -v {} "$THUNK_OUTPUT_DIR/" \;
          fi

          sudo umount /tmp/rootfs-mount

          echo "=== ThunkLibs terkumpul ==="
          ls -la "$THUNK_OUTPUT_DIR"
          echo "Jumlah file: $(ls -1 "$THUNK_OUTPUT_DIR" | wc -l)"
          echo "thunk_path=$THUNK_OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Upload ThunkLibs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fex-thunklibs
          path: ${{ steps.generate_thunks.outputs.thunk_path }}
          if-no-files-found: warn
          retention-days: 7
