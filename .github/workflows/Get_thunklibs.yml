name: Get FEX ThunkLibs (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget zstd tar squashfs-tools fuse squashfuse

      - name: Download and install FEX-emu package (Arch Linux ARM64)
        run: |
          wget https://repo.archlinuxcn.org/aarch64/fex-emu-2605-1-aarch64.pkg.tar.zst
          mkdir -p /tmp/fex-pkg
          tar --zstd -xf fex-emu-2605-1-aarch64.pkg.tar.zst -C /tmp/fex-pkg
          sudo cp -r /tmp/fex-pkg/usr/* /usr/local/
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/fex.conf
          sudo ldconfig

      - name: Verify FEX Installation
        run: |
          FEXLoader --version || true
          ls -la /usr/local/bin/FEX* || true

      - name: Download RootFS (SquashFS)
        run: |
          mkdir -p $HOME/.fex-emu/RootFS/
          wget -O $HOME/.fex-emu/RootFS/Ubuntu_24_04.sqsh \
            https://rootfs.fex-emu.gg/Ubuntu_24_04/2025-12-27/Ubuntu_24_04.sqsh

      - name: Configure FEX RootFS in Config.json
        run: |
          mkdir -p $HOME/.fex-emu/
          cat > $HOME/.fex-emu/Config.json <<EOF
          {
            "Config": {
              "RootFS": "$HOME/.fex-emu/RootFS/Ubuntu_24_04.sqsh"
            }
          }
          EOF
          cat $HOME/.fex-emu/Config.json

      - name: Collect ThunkLibs
        id: collect_thunks
        run: |
          THUNK_OUTPUT_DIR="$HOME/fex-thunklibs"
          mkdir -p "$THUNK_OUTPUT_DIR"

          # 1. Host-side ThunkLibs (dari instalasi FEX)
          if [ -d "/usr/local/lib/fex-emu/HostThunks" ]; then
            echo "Menyalin HostThunks..."
            cp -rv /usr/local/lib/fex-emu/HostThunks/* "$THUNK_OUTPUT_DIR/" 2>/dev/null || true
          fi

          # 2. Guest-side ThunkLibs (dari instalasi FEX)
          if [ -d "/usr/local/share/fex-emu/GuestThunks" ]; then
            echo "Menyalin GuestThunks..."
            cp -rv /usr/local/share/fex-emu/GuestThunks/* "$THUNK_OUTPUT_DIR/" 2>/dev/null || true
          fi

          # 3. Mount SquashFS dan cari file thunk di dalamnya
          mkdir -p /tmp/rootfs-mount
          sudo mount -t squashfs -o ro "$HOME/.fex-emu/RootFS/Ubuntu_24_04.sqsh" /tmp/rootfs-mount
          echo "Mencari file thunk di dalam rootfs..."
          find /tmp/rootfs-mount -type f \( -name "*thunk*.so*" -o -name "*thunk*.a" -o -path "*/ThunkLibs/*" \) -exec cp -v {} "$THUNK_OUTPUT_DIR/" \; 2>/dev/null || true
          sudo umount /tmp/rootfs-mount

          echo "=== ThunkLibs terkumpul ==="
          ls -la "$THUNK_OUTPUT_DIR"
          echo "Jumlah file: $(ls -1 "$THUNK_OUTPUT_DIR" | wc -l)"
          echo "thunk_path=$THUNK_OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Upload ThunkLibs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fex-thunklibs
          path: ${{ steps.collect_thunks.outputs.thunk_path }}
          if-no-files-found: warn
          retention-days: 7
