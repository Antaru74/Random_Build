name: Build FEX-Emu DEB for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build FEX
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}/output:/output \
            debian:trixie-slim \
            bash -c "
              set -ex

              apt update
              apt install -y curl git cmake ninja-build build-essential clang lld \
                libasound2-dev libcapstone-dev \
                libcurl4-openssl-dev libdrm-dev libedit-dev libgl1-mesa-dev \
                libssl-dev libudev-dev libvulkan-dev libwayland-dev \
                libx11-dev libxcb1-dev libxcb-icccm4-dev libxcb-image0-dev \
                libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
                libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev \
                libxcb-xfixes0-dev libxcb-xinerama0-dev libxext-dev \
                libxrandr-dev libxxf86vm-dev libzstd-dev \
                llvm-19-dev nasm pkgconf python3 python3-pip \
                qt6-base-dev qt6-declarative-dev squashfs-tools squashfuse \
                wayland-protocols

              # Hapus qml6-module jika gagal, tidak diperlukan untuk build
              # Clone dan build
              git clone --recurse-submodules https://github.com/FEX-Emu/FEX.git /FEX
              cd /FEX
              mkdir build && cd build

              cmake .. -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DUSE_LINKER=lld \
                -DENABLE_LTO=True \
                -DBUILD_TESTING=False \
                -DENABLE_ASSERTIONS=False \
                -DBUILD_THUNKS=True \
                -DCMAKE_INSTALL_PREFIX=/usr

              ninja -j\$(nproc)
              cpack -G DEB -C Release
              cp *.deb /output/
            "

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: fex-emu-deb
          path: output/*.deb
