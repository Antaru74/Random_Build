name: Build FEX Emu Portable (ARM64)

on:
  workflow_dispatch:   # Memungkinkan trigger manual
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # Menggunakan runner ARM64 native GitHub
    container:
      image: debian:trixie-slim   # Docker otomatis menarik image arm64 (aarch64)
    steps:
      - name: Install dasar dan siapkan environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git curl ca-certificates
          # Pastikan tidak ada interaksi pengguna saat install
          export DEBIAN_FRONTEND=noninteractive

      - name: Jalankan script build
        run: |
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -e

          export DEBIAN_FRONTEND=noninteractive

          echo "Menambahkan repository trixie-backports..."
          echo "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" | tee -a /etc/apt/sources.list

          echo "Memperbarui daftar paket dan menginstall libcurl4-openssl-dev dari backports..."
          apt-get update
          apt-get install -t trixie-backports -y libcurl4-openssl-dev

          echo "Menginstall semua build dependencies (Native ARM64)..."
          apt-get install -y \
              build-essential \
              ccache \
              clang \
              cmake \
              curl \
              git \
              libasound2-dev \
              libcapstone-dev \
              libclang-19-dev \
              libclang-21-dev \
              libcurl4-openssl-dev \
              libdrm-dev \
              libedit-dev \
              libgl1-mesa-dev \
              libssl-dev \
              libudev-dev \
              libvulkan-dev \
              libwayland-dev \
              libx11-dev \
              libxcb-icccm4-dev \
              libxcb-image0-dev \
              libxcb-keysyms1-dev \
              libxcb-randr0-dev \
              libxcb-render-util0-dev \
              libxcb-shape0-dev \
              libxcb-shm0-dev \
              libxcb-sync-dev \
              libxcb-xfixes0-dev \
              libxcb-xinerama0-dev \
              libxcb1-dev \
              libxext-dev \
              libxrandr-dev \
              libxxf86vm-dev \
              libzstd-dev \
              lld \
              llvm \
              llvm-19-dev \
              nasm \
              ninja-build \
              pkgconf \
              python3 \
              python3-pip \
              python3-setuptools \
              python3-venv \
              qml6-module-qtqml-workerscript \
              qml6-module-qtquick-controls \
              qml6-module-qtquick-dialogs \
              qml6-module-qtquick-layouts \
              qml6-module-qtquick-templates \
              qml6-module-qtquick-window \
              qt6-base-dev \
              qt6-declarative-dev \
              squashfs-tools \
              squashfuse \
              wayland-protocols

          echo "Meng-clone repository FEX..."
          if [ -d "FEX" ]; then
              echo "Direktori FEX sudah ada, melanjutkan ke dalamnya..."
              cd FEX
              git pull --recurse-submodules
          else
              git clone --recurse-submodules https://github.com/FEX-Emu/FEX.git
              cd FEX
          fi

          echo "Membuat direktori build..."
          mkdir -p build
          cd build

          echo "Mengkonfigurasi build dengan CMake..."
          # BUILD_THUNKS di-set ke False karena thunks membutuhkan compiler x86/x64
          cmake .. -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DUSE_LINKER=lld \
              -DENABLE_LTO=True \
              -DBUILD_TESTING=False \
              -DENABLE_ASSERTIONS=False \
              -DBUILD_THUNKS=False

          echo "Memulai proses build dengan Ninja..."
          ninja -j"$(nproc)"

          echo "Menginstall FEX ke staging directory..."
          mkdir -p /root/FEX-Portable
          DESTDIR=/root/FEX-Portable ninja install

          echo "Membuat arsip portable..."
          cd /root
          tar -czvf /github/workspace/fex-emu-portable-arm64.tar.gz FEX-Portable/

          echo "Selesai! FEX Emu portable siap di /github/workspace/fex-emu-portable-arm64.tar.gz"
          EOF

          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fex-emu-portable-arm64
          path: fex-emu-portable-arm64.tar.gz
          if-no-files-found: error
