name: Build FEX-core DEB (ARM64 Linux) - checkinstall

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: true
        default: 'main'
        type: string
      version_suffix:
        description: 'Optional version suffix'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: FEX-Emu/FEX
  PKG_NAME:      fex-emu

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git ninja-build pkg-config \
            clang lld libasound2-dev libepoxy-dev libgl1-mesa-dev libsdl2-dev \
            libudev-dev uuid-dev zlib1g-dev liburing-dev checkinstall
          sudo apt install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools libqt5x11extras5-dev

      - name: Checkout FEX source with submodules
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 0
          submodules: recursive

      - name: Get version info
        id: version
        working-directory: src
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          VERSION="0.${COMMIT_SHORT}"
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then VERSION="0.${COMMIT_SHORT}+${SUFFIX}"; fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

      - name: Clean Build directory
        working-directory: src
        run: |
          rm -rf Build
          mkdir Build

      - name: Configure CMake (disable GUI component)
        working-directory: src
        run: |
          cd Build
          CC=clang CXX=clang++ cmake \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LINKER=lld \
            -DENABLE_LTO=True \
            -DBUILD_TESTING=False \
            -DENABLE_ASSERTIONS=False \
            -DBUILD_FEXCONFIG=False \
            -G Ninja ..

      - name: Build with Ninja
        working-directory: src/Build
        run: ninja

      - name: Create DEB package with checkinstall
        working-directory: src/Build
        run: |
          sudo checkinstall \
            --pkgname=${{ env.PKG_NAME }} \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --backup=no \
            --deldoc=yes \
            --fstrans=no \
            --default \
            ninja install

      - name: Find and rename DEB package
        working-directory: src/Build
        run: |
          DEB_FILE=$(find . -maxdepth 1 -name "*.deb" -type f | head -n1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb file was created"
            exit 1
          fi
          echo "Found: $DEB_FILE"
          mv "$DEB_FILE" "${{ env.PKG_NAME }}_${{ steps.version.outputs.version }}_arm64.deb"
          echo "DEB_FILE=${{ env.PKG_NAME }}_${{ steps.version.outputs.version }}_arm64.deb" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}-arm64
          path: src/Build/${{ env.PKG_NAME }}_${{ steps.version.outputs.version }}_arm64.deb

      - name: Create GitHub Release (optional)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}
          name: "FEX-Emu ${{ steps.version.outputs.version }}"
          files: src/Build/${{ env.PKG_NAME }}_${{ steps.version.outputs.version }}_arm64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
