name: Remote SSH Runner

on:
  workflow_dispatch: # Mengaktifkan tombol "Run workflow" manual di GitHub

jobs:
  ssh-setup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up SSH Server
      run: |
        # Buat password untuk user 'runner' (ganti 'rahasia123' dengan password pilihanmu)
        echo "runner:rahasia123" | sudo chpasswd
        
        # Izinkan login menggunakan password via SSH
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
        sudo sed -i 's/Include \/etc\/ssh\/sshd_config.d\/\*.conf/# Include \/etc\/ssh\/sshd_config.d\/\*.conf/g' /etc/ssh/sshd_config
        sudo systemctl restart ssh
        
    - name: Connect to Pinggy Tunnel
      run: |
        echo "=========================================================="
        echo "Tunggu beberapa detik, lalu LIHAT ALAMAT SSH DI BAWAH INI:"
        echo "=========================================================="
        
        # Membuka tunnel reverse SSH menggunakan Pinggy selama 1 jam (3600 detik)
        ssh -o StrictHostKeyChecking=no -R 0:localhost:22 tcp@a.pinggy.io "sleep 3600"
