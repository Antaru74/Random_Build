name: Large Storage SSH Runner

on:
  workflow_dispatch:

jobs:
  ssh-runner:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Up Disk Space
      run: |
        # Membersihkan file bawaan runner yang tidak diperlukan agar storage makin lega (~140GB+)
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        df -h
        
    - name: Set up SSH Server
      run: |
        echo "runner:rahasia123" | sudo chpasswd
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
        sudo systemctl restart ssh
        
    - name: Install & Run Ngrok
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        # Download dan install Ngrok resmi
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.co.dev/ngrok.asc >/dev/null
        echo "deb [signed-by=/etc/apt/trusted.gpg.co.dev/ngrok.asc] https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install ngrok -y
        
        # Konfigurasi token
        ngrok config add-authtoken $NGROK_TOKEN
        
        echo "=========================================================="
        echo "MENYAMBUNGKAN KE NGROK... SILAHKAN CEK DASHBOARD NGROK KAMU"
        echo "=========================================================="
        
        # Jalankan tunnel SSH selama 6 jam (21600 detik)
        ngrok tcp 22 --log=stdout & sleep 21600
