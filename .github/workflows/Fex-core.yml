name: Build FEX-core DEB package (ARM64 - Clang)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: true
        default: 'main'
        type: string

jobs:
  build-fex-deb:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout FEX repository with submodules
        uses: actions/checkout@v4
        with:
          repository: FEX-Emu/FEX
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0   # perlu fetch-depth:0 agar git describe bekerja
          submodules: 'recursive'

      - name: Install build dependencies (including Qt6)
        run: |
          sudo apt update
          sudo apt install -y \
            git cmake ninja-build pkgconf clang lld ccache nasm python3-clang \
            libstdc++-12-dev checkinstall \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev

      - name: Configure with CMake (Clang + LLD, disable tests)
        run: |
          cmake -B Build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_LINKER=/usr/bin/ld.lld \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=True \
            -DBUILD_TESTS=False \
            -G Ninja

      - name: Build FEXCore
        run: |
          cmake --build Build --config Release

      - name: Create DEB package
        run: |
          cd Build
          MAINTAINER="$(git log -1 --format='%aN <%aE>')"
          
          # Generate valid version number (must start with digit)
          # Try to get latest tag, else use 0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          LATEST_TAG=${LATEST_TAG#v}  # remove leading v
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          VERSION="${LATEST_TAG}+git${COMMIT_SHORT}"
          # Ensure version starts with digit (if tag is like '2508' it's fine)
          # If somehow still not digit, prepend 0.
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION="0.${VERSION}"
          fi
          
          sudo checkinstall \
            --pkgname=fex-core \
            --pkgversion="$VERSION" \
            --pkgrelease="1" \
            --pkglicense="MIT" \
            --pkggroup="misc" \
            --maintainer="$MAINTAINER" \
            --provides="fex-core" \
            --requires="libc6, libstdc++6" \
            --install=no \
            --fstrans=yes \
            --nodoc \
            ninja install
          
          # Debug: list files
          echo "Files in $(pwd):"
          ls -la
          echo "Searching for .deb files..."
          DEB_FILE=$(find . -maxdepth 1 -name "*.deb" -type f | head -n1)
          if [[ -z "$DEB_FILE" ]]; then
            echo "::error::No .deb file was created. Check checkinstall logs."
            exit 1
          fi
          echo "Found .deb: $DEB_FILE"
          mv "$DEB_FILE" fex-core.deb

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: fex-core-arm64-clang-${{ github.event.inputs.branch }}
          path: Build/fex-core.deb
