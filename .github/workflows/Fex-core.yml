name: Build FEX-core DEB package (ARM64 - Clang)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: true
        default: 'main'
        type: string

jobs:
  build-fex-deb:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout FEX repository with submodules
        uses: actions/checkout@v4
        with:
          repository: FEX-Emu/FEX
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1
          submodules: 'recursive'

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            cmake \
            ninja-build \
            pkgconf \
            clang \
            lld \
            ccache \
            nasm \
            python3-clang \
            libstdc++-12-dev \
            checkinstall

      - name: Configure with CMake (Clang + LLD, tanpa tools & tests)
        run: |
          cmake -B Build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_LINKER=/usr/bin/ld.lld \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=True \
            -DBUILD_TESTS=False \
            -DBUILD_TOOLS=OFF \
            -G Ninja

      - name: Build FEXCore
        run: |
          cmake --build Build --config Release

      - name: Create DEB package
        run: |
          cd Build
          sudo checkinstall \
            --pkgname=fex-core \
            --pkgversion="git-$(git describe --tags --always | sed 's/^v//')" \
            --pkgrelease="1" \
            --pkglicense="MIT" \
            --pkggroup="misc" \
            --maintainer="'$(git log -1 --pretty=%aN <%aE>)'" \
            --provides="fex-core" \
            --requires="libc6, libstdc++6" \
            --install=no \
            --fstrans=yes \
            --nodoc \
            ninja install

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: fex-core-arm64-clang-${{ github.event.inputs.branch }}
          path: Build/*.deb
