name: Build WineGUI (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Clone repository via git link
        run: |
          git clone https://github.com/winegui/WineGUI.git

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            cmake \
            ninja-build \
            libgtkmm-4.0-dev \
            libjson-glib-dev \
            pkg-config \
            dpkg-dev \
            fakeroot

      - name: Configure with CMake (disable type-limits warning)
        working-directory: WineGUI
        run: |
          cmake -GNinja -B build \
            -DCMAKE_CXX_FLAGS="-Wno-type-limits"

      - name: Build WineGUI
        working-directory: WineGUI
        run: |
          cmake --build ./build

      - name: Create .deb package using CPack
        working-directory: WineGUI
        run: |
          cd build
          cpack -G DEB

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: winegui-arm64-deb
          path: WineGUI/build/*.deb
          if-no-files-found: error
