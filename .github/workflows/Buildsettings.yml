name: Build Settings APK and Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Setup Java Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. Clone Repositori Target (ascp-oss)
    - name: Clone Target Repository
      run: |
        git clone --depth=1 https://github.com/ascp-oss/android_packages_apps_Settings.git settings_src

    # 3. Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Suntikkan Gradle Build System secara Manual (Tanpa Gradle Sistem)
    - name: Inject Gradle Build System
      run: |
        cd settings_src
        
        # 1. Buat folder modul 'app'
        mkdir -p app
        
        # 2. Unduh Gradle Wrapper resmi yang sudah jadi (Bypass Gradle 9.x)
        curl -LO https://raw.githubusercontent.com/gradle/gradle-distributions/main/wrapper/gradlew
        chmod +x gradlew
        mkdir -p gradle/wrapper
        cat <<EOF > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # 3. Buat file settings.gradle
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ASCP_Settings"
        include ':app'
        EOF
        
        # 4. Buat file build.gradle utama (Root)
        cat <<EOF > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.2'
            }
        }
        EOF

        # 5. Buat file build.gradle untuk modul ':app'
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.android.settings'
            compileSdk 34
        
            defaultConfig {
                applicationId "com.android.settings"
                minSdk 30
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        
            sourceSets {
                main {
                    manifest.srcFile 'AndroidManifest.xml'
                    java.srcDirs = ['src']
                    res.srcDirs = ['res']
                    assets.srcDirs = ['assets']
                }
            }
            
            lintOptions {
                abortOnError false
            }
        }
        EOF
        
        # 6. Pindahkan file kode sumber AOSP ke dalam folder 'app'
        mv src res AndroidManifest.xml app/ 2>/dev/null || true

    # 5. Proses Kompilasi Menggunakan Gradlew Lokal (Bukan Sistem)
    - name: Build APK with Gradle
      run: |
        cd settings_src
        ./gradlew :app:assembleRelease --no-daemon

    # 6. Membuat Struktur Modul Magisk
    - name: Create Magisk Module Structure
      run: |
        mkdir -p magisk_module/system/system_ext/priv-app/Settings
        
        cat <<EOF > magisk_module/module.prop
        id=ascp_settings_replacer
        name=ASCP Settings Replacer
        version=v1.0
        versionCode=1
        author=GitHub Actions
        description=Menggantikan /system_ext/priv-app/Settings/Settings.apk secara systemless menggunakan Magisk. Saat modul di-uninstall, Settings bawaan ROM akan kembali otomatis.
        EOF

        # Menyalin APK ke folder modul Magisk
        find settings_src -name "*.apk" -exec cp {} magisk_module/system/system_ext/priv-app/Settings/Settings.apk \;

    # 7. Mengompres Modul Menjadi File ZIP
    - name: Package Magisk Module to ZIP
      run: |
        cd magisk_module
        zip -r ../ASCP_Settings_Magisk_Module.zip ./*
        cd ..

    # 8. Mengunggah Hasil ZIP Ke GitHub Artifacts
    - name: Upload Magisk Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ASCP-Settings-Magisk-Module
        path: ASCP_Settings_Magisk_Module.zip
