name: Build Settings APK and Magisk Module

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan build secara manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Setup Java Environment (Diperlukan untuk Gradle/Android Build)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. Clone Repositori Target (ascp-oss)
    - name: Clone Target Repository
      run: |
        git clone --depth=1 https://github.com/ascp-oss/android_packages_apps_Settings.git settings_src

    # 3. Setup Android SDK & Build Tools
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Proses Kompilasi (Build APK)
    # Catatan: Langkah ini berasumsi repositori sudah memiliki wrapper Gradle (gradlew).
    # Jika membutuhkan stub framework eksternal, skrip akan mendownloadnya secara otomatis jika dikonfigurasi di build.gradle.
    - name: Build APK with Gradle
      run: |
        cd settings_src
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
      continue-on-error: true # Mengantisipasi jika ada error grading karena hidden API

    # 5. Membuat Struktur Modul Magisk (Systemless)
    - name: Create Magisk Module Structure
      run: |
        mkdir -p magisk_module/system/system_ext/priv-app/Settings
        
        # Membuat file properti modul Magisk
        cat <<EOF > magisk_module/module.prop
        id=ascp_settings_replacer
        name=ASCP Settings Replacer
        version=v1.0
        versionCode=1
        author=GitHub Actions
        description=Menggantikan /system_ext/priv-app/Settings/Settings.apk secara systemless menggunakan Magisk. Saat modul di-uninstall, Settings bawaan ROM akan kembali otomatis.
        EOF

        # Menyalin APK hasil build ke dalam struktur modul
        # Menyesuaikan dengan target jalur /system_ext/priv-app/Settings/
        if [ -d "settings_src/app/build/outputs/apk/release" ]; then
          cp settings_src/app/build/outputs/apk/release/*.apk magisk_module/system/system_ext/priv-app/Settings/Settings.apk
        else
          # Fallback jika struktur foldernya berbeda (misal build root)
          find settings_src -name "*.apk" -exec cp {} magisk_module/system/system_ext/priv-app/Settings/Settings.apk \;
        fi

    # 6. Mengompres Modul Menjadi File ZIP
    - name: Package Magisk Module to ZIP
      run: |
        cd magisk_module
        zip -r ../ASCP_Settings_Magisk_Module.zip ./*
        cd ..

    # 7. Mengunggah Hasil ZIP Ke GitHub Artifacts (Bisa Kamu Download)
    - name: Upload Magisk Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ASCP-Settings-Magisk-Module
        path: ASCP_Settings_Magisk_Module.zip
