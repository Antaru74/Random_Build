name: Build Settings APK and Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Setup Java Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. Clone Repositori Target (ascp-oss)
    - name: Clone Target Repository
      run: |
        git clone --depth=1 https://github.com/ascp-oss/android_packages_apps_Settings.git settings_src

    # 3. Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Suntikkan Gradle Build System & Bersihkan Resource Non-Standar
    - name: Inject Gradle Build System
      run: |
        cd settings_src
        
        # 1. Buat folder modul 'app'
        mkdir -p app
        
        # 2. Buat file settings.gradle dan build.gradle kosong (pancingan awal untuk wrapper)
        touch settings.gradle
        touch build.gradle
        
        # 3. Buat wrapper menggunakan perintah gradle sistem diisolasi ke versi 8.0.2
        gradle wrapper --gradle-version 8.0.2
        
        # 4. Timpa file settings.gradle dengan konfigurasi yang benar
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ASCP_Settings"
        include ':app'
        EOF
        
        # 5. Timpa file build.gradle utama (Root)
        cat <<EOF > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.2'
            }
        }
        EOF

        # 6. Buat file build.gradle untuk modul ':app'
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.android.settings'
            compileSdk 34
        
            defaultConfig {
                applicationId "com.android.settings"
                minSdk 30
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        
            sourceSets {
                main {
                    manifest.srcFile 'AndroidManifest.xml'
                    java.srcDirs = ['src']
                    res.srcDirs = ['res']
                    assets.srcDirs = ['assets']
                }
            }
            
            lintOptions {
                abortOnError false
            }
        }
        EOF
        
        # 7. Pindahkan file kode sumber AOSP ke dalam folder 'app'
        mv src res AndroidManifest.xml app/ 2>/dev/null || true

        # 8. HAPUS FOLDER RESOURCE NON-STANDAR (Perbaikan Utama)
        # Menghapus folder values-*-feminine atau values-*-masculine yang tidak dikenali Gradle
        rm -rf app/res/values-*-feminine
        rm -rf app/res/values-*-masculine

    # 5. Proses Kompilasi Menggunakan Gradlew Lokal
    - name: Build APK with Gradle
      run: |
        cd settings_src
        chmod +x gradlew
        ./gradlew :app:assembleRelease --no-daemon

    # 6. Membuat Struktur Modul Magisk
    - name: Create Magisk Module Structure
      run: |
        mkdir -p magisk_module/system/system_ext/priv-app/Settings
        
        cat <<EOF > magisk_module/module.prop
        id=ascp_settings_replacer
        name=ASCP Settings Replacer
        version=v1.0
        versionCode=1
        author=GitHub Actions
        description=Menggantikan /system_ext/priv-app/Settings/Settings.apk secara systemless menggunakan Magisk. Saat modul di-uninstall, Settings bawaan ROM akan kembali otomatis.
        EOF

        # Menyalin APK ke folder modul Magisk
        find settings_src -name "*.apk" -exec cp {} magisk_module/system/system_ext/priv-app/Settings/Settings.apk \;

    # 7. Mengompres Modul Menjadi File ZIP
    - name: Package Magisk Module to ZIP
      run: |
        cd magisk_module
        zip -r ../ASCP_Settings_Magisk_Module.zip ./*
        cd ..

    # 8. Mengunggah Hasil ZIP Ke GitHub Artifacts
    - name: Upload Magisk Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ASCP-Settings-Magisk-Module
        path: ASCP_Settings_Magisk_Module.zip
