name: Build FEX-core DEB (ARM64 Linux)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build (e.g., main, v0.1.0)'
        required: true
        default: 'main'
        type: string
      version_suffix:
        description: 'Optional version suffix (e.g., alpha1)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: FEX-Emu/FEX
  PKG_NAME:      fex-core

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repo (optional)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git cmake ninja-build pkgconf \
            clang lld ccache nasm python3-clang \
            libstdc++-12-dev checkinstall

      - name: Checkout FEX source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 0   # penting agar git describe bisa baca tag

      - name: Sync & update submodules
        working-directory: src
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Get version info
        id: version
        working-directory: src
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          # Coba ambil tag terakhir, jika tidak ada pakai 0.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          LAST_TAG=${LAST_TAG#v}   # hapus 'v' di awal
          # Tambahkan suffix jika ada
          SUFFIX="${{ inputs.version_suffix }}"
          if [[ -n "$SUFFIX" ]]; then
            VERSION="${LAST_TAG}+${SUFFIX}"
          else
            VERSION="${LAST_TAG}"
          fi
          # Pastikan versi dimulai dengan digit (checkinstall requirement)
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION="0.${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

      - name: Configure CMake (Clang + LLD, disable tests & tools)
        working-directory: src
        run: |
          cmake -B Build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_LINKER=/usr/bin/ld.lld \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -G Ninja

      - name: Build FEXCore
        working-directory: src
        run: |
          cmake --build Build --config Release

      - name: Create DEB package using checkinstall
        working-directory: src
        run: |
          cd Build
          # Ambil maintainer dengan format aman
          MAINTAINER="$(git log -1 --format='%aN <%aE>')"
          VERSION="${{ steps.version.outputs.version }}"
          sudo checkinstall \
            --pkgname="${{ env.PKG_NAME }}" \
            --pkgversion="$VERSION" \
            --pkgrelease="1" \
            --pkglicense="MIT" \
            --pkggroup="misc" \
            --maintainer="$MAINTAINER" \
            --provides="${{ env.PKG_NAME }}" \
            --requires="libc6, libstdc++6" \
            --install=no \
            --fstrans=yes \
            --nodoc \
            ninja install
          # Cari file .deb yang dihasilkan
          DEB_FILE=$(find . -maxdepth 1 -name "*.deb" -type f | head -n1)
          if [[ -z "$DEB_FILE" ]]; then
            echo "::error::No .deb file was created. Check checkinstall logs."
            exit 1
          fi
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_ENV
          # Rename agar konsisten
          mv "$DEB_FILE" "${{ env.PKG_NAME }}.deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}-arm64
          path: src/Build/${{ env.PKG_NAME }}.deb
          if-no-files-found: error

      - name: (Optional) Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}
          name: "FEXCore ${{ steps.version.outputs.version }}"
          body: |
            Built from branch/commit: ${{ inputs.branch }}
            Commit: ${{ steps.version.outputs.commit }}
            Architecture: ARM64 (aarch64)
            Compiler: Clang 18 + LLD
            LTO: enabled
          files: src/Build/${{ env.PKG_NAME }}.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
