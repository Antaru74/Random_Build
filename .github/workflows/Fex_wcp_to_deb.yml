name: Build FEX-core DEB (ARM64 Linux)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build (e.g., main, v0.1.0)'
        required: true
        default: 'main'
        type: string
      version_suffix:
        description: 'Optional version suffix (e.g., alpha1)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: FEX-Emu/FEX
  PKG_NAME:      fex-core

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-24.04-arm   # ARM64 runner
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repo (optional, for scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git cmake ninja-build pkgconf \
            clang lld ccache nasm python3-clang \
            libstdc++-12-dev checkinstall \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev

      - name: Checkout FEX source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 1

      - name: Sync & update submodules
        working-directory: src
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Get version info
        id: version
        working-directory: src
        run: |
          # Get short commit hash
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          # Get last tag (if any)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "git-${COMMIT_SHORT}")
          # Clean tag prefix v
          LAST_TAG=${LAST_TAG#v}
          # Append suffix if provided
          if [[ -n "${{ inputs.version_suffix }}" ]]; then
            VERSION="${LAST_TAG}+${{ inputs.version_suffix }}"
          else
            VERSION="${LAST_TAG}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

      - name: Configure CMake (Clang + LLD)
        working-directory: src
        run: |
          cmake -B Build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_LINKER=/usr/bin/ld.lld \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -G Ninja

      - name: Build FEXCore
        working-directory: src
        run: |
          cmake --build Build --config Release

      - name: Create DEB package using checkinstall
        working-directory: src
        run: |
          cd Build
          sudo checkinstall \
            --pkgname=${{ env.PKG_NAME }} \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --pkgrelease="1" \
            --pkglicense="MIT" \
            --pkggroup="misc" \
            --maintainer="$(git log -1 --pretty=%aN <%aE>)" \
            --provides="${{ env.PKG_NAME }}" \
            --requires="libc6, libstdc++6" \
            --install=no \
            --fstrans=yes \
            --nodoc \
            ninja install

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}-arm64
          path: src/Build/*.deb
          if-no-files-found: error

      - name: (Optional) Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}
          name: "FEXCore ${{ steps.version.outputs.version }}"
          body: |
            Built from branch/commit: ${{ inputs.branch }}
            Commit: ${{ steps.version.outputs.commit }}
            Architecture: ARM64 (aarch64)
            Compiler: Clang 18 + LLD
            LTO: enabled
          files: src/Build/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
