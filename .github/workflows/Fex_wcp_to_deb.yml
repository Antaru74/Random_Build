name: Build FEX-core DEB (ARM64 Linux)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build (e.g., main, v0.1.0)'
        required: true
        default: 'main'
        type: string
      version_suffix:
        description: 'Optional version suffix (e.g., alpha1)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: FEX-Emu/FEX
  PKG_NAME:      fex-core

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git cmake ninja-build pkgconf \
            clang lld ccache nasm python3-clang \
            libstdc++-12-dev checkinstall

      - name: Checkout FEX source with submodules
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 0
          submodules: 'recursive'

      - name: Get version info
        id: version
        working-directory: src
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            VERSION="${LAST_TAG}+${SUFFIX}"
          else
            VERSION="${LAST_TAG}"
          fi
          # checkinstall requires version starting with digit
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="0.${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

      - name: Configure CMake (Clang + LLD)
        working-directory: src
        run: |
          cmake -B Build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_LINKER=/usr/bin/ld.lld \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -G Ninja

      - name: Build FEXCore
        working-directory: src
        run: |
          cmake --build Build --config Release

      - name: Create DEB package using checkinstall
        working-directory: src
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd Build
          # Safe maintainer (no parentheses/special chars)
          MAINTAINER="${GITHUB_ACTOR} <${GITHUB_ACTOR}@users.noreply.github.com>"
          sudo checkinstall --default \
            --pkgname="${{ env.PKG_NAME }}" \
            --pkgversion="${VERSION}" \
            --pkgrelease="1" \
            --pkglicense="MIT" \
            --pkggroup="misc" \
            --maintainer="${MAINTAINER}" \
            --provides="${{ env.PKG_NAME }}" \
            --requires="libc6, libstdc++6" \
            --install=no \
            --fstrans=yes \
            --nodoc \
            ninja install
          # Locate generated .deb file
          DEB_FILE=$(find . -maxdepth 1 -name "*.deb" -type f | head -n1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb file was created"
            exit 1
          fi
          mv "$DEB_FILE" "${{ env.PKG_NAME }}.deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ steps.version.outputs.version }}-arm64
          path: src/Build/${{ env.PKG_NAME }}.deb
          if-no-files-found: error
