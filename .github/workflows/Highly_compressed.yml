name: Real Highly Compress and Upload to Gofile (No Token)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL file zip game yang akan didownload'
        required: true
        type: string
        default: 'https://example.com/file.zip'
      filename:
        description: 'Nama file hasil akhir (contoh: Game_Ultra.7z)'
        required: false
        type: string
        default: 'ArmoredCore_Highly_Compressed.7z'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Pembersihan Ekstrem Space Harddisk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/clang
          sudo docker image prune --all --force
          sudo apt-get remove --purge -y azure-cli google-chrome-stable microsoft-edge-stable firefox powershell mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Proses Ekstrak dan Kompresi Ulang (Real Highly Compressed)
        run: |
          # 1. Buat folder sementara
          mkdir -p game_mentah
          
          echo "Mendownload dan langsung mengekstrak isi ZIP ke folder mentah..."
          # Menggunakan bsdtar (jika tersedia) atau 7z untuk ekstrak langsung dari URL ke folder tanpa simpan .zip nya
          sudo apt-get install -y bsdtar
          curl -L "${{ inputs.file_url }}" | bsdtar -xf - -C game_mentah/
          
          echo "Ekstrak selesai. Melakukan kompresi ulang tingkat tinggi pada isi file asli..."
          # Sekarang 7z akan mengompres isi file mentah game (bukan file zip-nya).
          # Ini yang akan membuat ukuran file berkurang drastis!
          7z a -mx=5 -m0=lzma2 -ms=on "${{ inputs.filename }}" ./game_mentah/*
          
          echo "Kompresi ulang berhasil!"
          echo "FILE_NAME=${{ inputs.filename }}" >> $GITHUB_ENV
          
          # Hapus folder mentah untuk melegakan space sebelum upload
          rm -rf game_mentah

      - name: Upload ke Gofile tanpa token
        run: |
          SERVER_RESPONSE=$(curl -s https://api.gofile.io/servers)
          SERVER=$(echo $SERVER_RESPONSE | jq -r '.data.servers[0].name')
          echo "Menggunakan server: $SERVER"

          UPLOAD_RESPONSE=$(curl -s -X POST \
            -F "file=@${{ env.FILE_NAME }}" \
            "https://${SERVER}.gofile.io/uploadFile")
          
          STATUS=$(echo $UPLOAD_RESPONSE | jq -r '.status')
          if [ "$STATUS" != "ok" ]; then
            echo "Upload gagal: $UPLOAD_RESPONSE"
            exit 1
          fi
          
          DOWNLOAD_URL=$(echo $UPLOAD_RESPONSE | jq -r '.data.downloadPage')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          
          DIRECT_LINK=$(echo $UPLOAD_RESPONSE | jq -r '.data.directLink // empty')
          if [ -n "$DIRECT_LINK" ]; then
            echo "DIRECT_LINK=$DIRECT_LINK" >> $GITHUB_ENV
          fi

      - name: Tampilkan link download
        run: |
          echo "✅ Proses Berhasil!"
          echo "📦 Nama File Arsip: ${{ env.FILE_NAME }}"
          echo "🔗 Halaman download: ${{ env.DOWNLOAD_URL }}"
          if [ -n "${{ env.DIRECT_LINK }}" ]; then
            echo "⚡ Direct link: ${{ env.DIRECT_LINK }}"
          fi
