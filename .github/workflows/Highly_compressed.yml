name: Download, Stream Compress, and Upload to Gofile (No Token)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL file yang akan didownload'
        required: true
        type: string
        default: 'https://example.com/file.zip'
      filename:
        description: 'Nama file hasil akhir (opsional, contoh: game.7z)'
        required: false
        type: string
        default: 'Arsip_Highly_Compressed.7z'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Pembersihan Ekstrem (Brutal Free Disk Space)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/clang
          sudo docker image prune --all --force
          sudo apt-get remove --purge -y azure-cli google-chrome-stable microsoft-edge-stable firefox powershell mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download & Compress via Streaming (On-The-Fly)
        run: |
          # Menentukan nama file output
          OUTPUT_NAME="${{ inputs.filename }}"
          if [ -z "$OUTPUT_NAME" ]; then
            OUTPUT_NAME="Hasil_Kompresi.7z"
          fi
          
          echo "Memulai proses Streaming Download + Kompresi Tingkat Tinggi..."
          echo "File asli tidak akan disimpan di harddisk untuk menghemat space."
          
          # Trik Utama:
          # curl -L download file -> dialirkan lewat tanda pipe (|) -> diterima oleh 7z
          # -si : memerintahkan 7z untuk membaca data dari aliran/stream (Standard Input)
          # -mx=5 : kompresi tingkat tinggi yang cepat dan aman
          curl -L "${{ inputs.file_url }}" | 7z a -si -mx=9 -m0=lzma2 -mmt=on "$OUTPUT_NAME"
          
          echo "Proses Streaming dan Kompresi Selesai!"
          echo "FILE_NAME=$OUTPUT_NAME" >> $GITHUB_ENV

      - name: Upload ke Gofile tanpa token
        id: gofile
        run: |
          SERVER_RESPONSE=$(curl -s https://api.gofile.io/servers)
          SERVER=$(echo $SERVER_RESPONSE | jq -r '.data.servers[0].name')
          echo "Menggunakan server: $SERVER"

          UPLOAD_RESPONSE=$(curl -s -X POST \
            -F "file=@${{ env.FILE_NAME }}" \
            "https://${SERVER}.gofile.io/uploadFile")
          
          STATUS=$(echo $UPLOAD_RESPONSE | jq -r '.status')
          if [ "$STATUS" != "ok" ]; then
            echo "Upload gagal: $UPLOAD_RESPONSE"
            exit 1
          fi
          
          DOWNLOAD_URL=$(echo $UPLOAD_RESPONSE | jq -r '.data.downloadPage')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          
          DIRECT_LINK=$(echo $UPLOAD_RESPONSE | jq -r '.data.directLink // empty')
          if [ -n "$DIRECT_LINK" ]; then
            echo "DIRECT_LINK=$DIRECT_LINK" >> $GITHUB_ENV
          fi

      - name: Tampilkan link download
        run: |
          echo "✅ Proses Berhasil!"
          echo "📦 Nama File Arsip: ${{ env.FILE_NAME }}"
          echo "🔗 Halaman download: ${{ env.DOWNLOAD_URL }}"
          if [ -n "${{ env.DIRECT_LINK }}" ]; then
            echo "⚡ Direct link: ${{ env.DIRECT_LINK }}"
          fi
